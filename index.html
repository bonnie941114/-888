<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>日系減壓 · 智慧對話式雙幣手帳</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap');
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  :root {
    --bg-page: #FBFBFA;      /* 無印舒適暖米白 */
    --surface: #FFFFFF;      
    --text-main: #2D3748;    
    --text-muted: #A0AEC0;   
    --border: #EDF2F7; 
    --primary: #9DB4C0;      /* 寧靜藍 */
    --expense: #C97A7A;      /* 櫻花柔粉 */
    
    --line-chat-bg: #F0F2F5;  
    --bot-bubble: #FFFFFF;    
    --user-bubble: #E3F0E5;   
    --user-text: #3B7A57;     
    --active-green: #48BB78;
  }
  
  body { font-family: 'Noto Sans TC', sans-serif; color: var(--text-main); background: var(--bg-page); height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  .num-font { font-family: 'Manrope', sans-serif; }

  /* ================= 全球大廠 App 級底部分頁架構 (徹底消滅跑版) ================= */
  .layout-grid { max-width: 1200px; margin: 0 auto; width: 100%; display: grid; grid-template-columns: 1.2fr 1.1fr; gap: 24px; flex: 1; min-height: 0; padding: 16px; }
  .col { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  
  /* 手機專屬底部分頁導航 (電腦端自動隱藏) */
  .phone-bottom-nav { display: none; background: var(--surface); border-top: 1px solid var(--border); height: 64px; padding-bottom: env(safe-area-inset-bottom); justify-content: space-around; align-items: center; flex-shrink: 0; z-index: 10; }
  .nav-tab-btn { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; cursor: pointer; width: 25%; position: relative; }
  .nav-tab-btn.active { color: var(--text-main); }
  .nav-tab-btn i { font-size: 18px; }
  .nav-badge { display: none; position: absolute; top: -2px; right: 32%; width: 6px; height: 6px; background: var(--expense); border-radius: 50%; }

  .card { background: var(--surface); border-radius: 24px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.01); display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .card-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  
  /* 頂部常駐毛玻璃感觀看板 */
  .live-status-board { background: rgba(248, 250, 252, 0.9); backdrop-filter: blur(8px); border-radius: 16px; padding: 12px 16px; border: 1px solid var(--border); margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .live-board-main { display: flex; justify-content: space-between; align-items: center; }
  .live-board-title { font-size: 11px; font-weight: 700; color: var(--text-muted); }
  .live-board-val { font-size: 20px; font-weight: 800; color: var(--expense); }
  .live-board-date-zone { display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border); padding-top: 6px; font-size: 11px; color: var(--text-muted); }
  .date-picker-input { border: none; background: transparent; color: var(--text-main); font-weight: 700; font-family: inherit; font-size: 12px; outline: none; text-align: right; }

  /* LINE 聊天主室 */
  .chat-room { flex: 1; background: var(--line-chat-bg); border-radius: 20px; border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; min-height: 0; position: relative; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .chat-messages::-webkit-scrollbar { display: none; }
  
  .msg-row { display: flex; align-items: flex-start; max-width: 90%; }
  .msg-row.bot { align-self: flex-start; gap: 8px; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .bot-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
  
  .bubble { padding: 10px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 500; line-height: 1.4; box-shadow: 0 2px 6px rgba(0,0,0,0.01); word-break: break-all; }
  .bot .bubble { background: var(--bot-bubble); color: var(--text-main); border-top-left-radius: 4px; border: 1px solid var(--border); }
  .user .bubble { background: var(--user-bubble); color: var(--user-text); border-top-right-radius: 4px; font-weight: 700; }
  
  /* 🎁 智慧快顯快選抽屜 (只在需要時優雅平鋪，絕不佔據歷史泡泡高度) */
  .quick-reply-drawer { background: var(--surface); border-top: 1px solid var(--border); display: none; flex-direction: column; padding: 10px; gap: 8px; flex-shrink: 0; }
  .drawer-title { font-size: 12px; font-weight: 700; color: var(--text-muted); text-align: center; }
  
  .chat-guide-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-height: 140px; overflow-y: auto; }
  .guide-btn { background: var(--bg-page); border: 1px solid var(--border); padding: 8px 2px; border-radius: 10px; font-size: 12px; font-weight: 700; color: var(--text-main); cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  
  .chip-guide-box { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 4px 0; }
  .chip-guide-btn { background: var(--bg-page); border: 1px solid var(--border); padding: 8px 16px; border-radius: 16px; font-size: 13px; font-weight: 700; cursor: pointer; color: var(--text-main); }

  /* 輸入框底欄 */
  .chat-input-bar { background: var(--surface); padding: 10px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .chat-control { flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 10px 14px; font-size: 14px; background: var(--bg-page); outline: none; color: var(--text-main); font-weight: 600; }
  .chat-send-btn { background: none; border: none; color: var(--primary); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .chat-camera-btn { color: var(--text-muted); font-size: 18px; cursor: pointer; }

  /* 統計與明細 */
  .pie-chart-wrapper { display: flex; justify-content: center; align-items: center; height: 180px; flex-shrink: 0; position: relative; margin-bottom: 12px; }
  .log-list { overflow-y: auto; flex: 1; min-height: 0; }
  .log-list::-webkit-scrollbar { display: none; }
  
  /* 1:1 還原手帳感分組明細標題 */
  .date-group-header { font-size: 12.5px; color: var(--text-muted); font-weight: 700; margin: 16px 0 8px 4px; display: flex; align-items: center; gap: 6px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; }
  .log-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--border); }
  .log-item:last-child { border-bottom: none; }
  .log-icon-circle { width: 38px; height: 38px; border-radius: 50%; background: #FFF9F3; display: flex; align-items: center; justify-content: center; font-size: 15px; border: 1px solid var(--border); flex-shrink: 0; }
  
  .log-title-area { display: flex; flex-direction: column; gap: 2px; }
  .log-time-stamp { font-size: 10.5px; color: var(--text-muted); font-weight: 500; }
  
  .log-jpy-val { font-size: 14.5px; font-weight: 800; text-align: right; }
  .log-twd-val { font-size: 11px; color: var(--text-muted); font-weight: 600; text-align: right; margin-top: 1px; }
  .receipt-thumbnail { width: 32px; height: 32px; border-radius: 6px; object-fit: cover; border: 1px solid var(--border); cursor: pointer; }
  .del-btn-container { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 6px; display: flex; align-items: center; justify-content: center; }

  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; align-items: center; justify-content: center; }
  #lightbox img { max-width: 90%; max-height: 80vh; border-radius: 12px; }

  /* ================= ⚡手機端物理級防跑版響應式 ================= */
  @media (max-width: 768px) {
    body { padding: 0; height: 100dvh; }
    .layout-grid { display: block; padding: 8px; height: calc(100% - 64px); position: relative; }
    .col { position: absolute; inset: 8px; display: none; height: calc(100% - 16px); }
    .col.active-panel { display: flex; }
    .phone-bottom-nav { display: flex; }
    .card { padding: 14px; border-radius: 20px; }
  }
</style>
</head>
<body>

<!-- 手機端常駐：國際 App 級底部分頁導航 -->
<div class="phone-bottom-nav">
  <button id="nav-btn-chat" class="nav-tab-btn active" onclick="App.switchTab('chat')">
    <i class="fa-regular fa-comment-dots"></i><span>對話記帳</span>
  </button>
  <button id="nav-btn-chart" class="nav-tab-btn" onclick="App.switchTab('chart')">
    <i class="fa-solid fa-chart-pie"></i><span>開銷統計</span>
    <span id="badge-chart" class="nav-badge"></span>
  </button>
  <button id="nav-btn-list" class="nav-tab-btn" onclick="App.switchTab('list')">
    <i class="fa-solid fa-list-ul"></i><span>消費明細</span>
    <span id="badge-list" class="nav-badge"></span>
  </button>
</div>

<div class="layout-grid">
  
  <!-- 【分頁一】LINE 智慧對話式記帳空間 -->
  <div class="col active-panel" id="panel-chat">
    <div class="card">
      
      <!-- 頂部常駐毛玻璃感預覽看板 -->
      <div class="live-status-board">
        <div class="live-board-main">
          <div>
            <div class="live-board-title">當前輸入日圓預覽</div>
            <div class="live-board-val num-font" id="live-jpy-board">¥ 0</div>
          </div>
          <div style="text-align: right;">
            <div class="live-board-title">即時折合台幣</div>
            <div class="live-board-val num-font" style="color:var(--primary);" id="live-twd-board">NT$ 0</div>
          </div>
        </div>
        <div class="live-board-date-zone">
          <span><i class="fa-regular fa-calendar-check"></i> 預設記帳日期（支援智慧識別變更）：</span>
          <input type="date" id="txn-date-picker" class="date-picker-input num-font">
        </div>
      </div>
      
      <!-- LINE 聊天區 -->
      <div class="chat-room">
        <div class="chat-messages" id="chat-flow-container">
          <div class="msg-row bot">
            <div class="bot-avatar">🤖</div>
            <div class="bubble">
              終極共榮版重構完成！防跑版抽屜鍵盤上線！<br><br>
              📅 <b>萬用日期智慧對話範例：</b><br>
              - `07/01 吃的日幣 665`<br>
              - `7月5日 買模型 4500`<br>
              - `昨天 飲料 150台幣`
            </div>
          </div>
        </div>
        
        <!-- 🎁 抽屜快顯選單 (高度固定，100%不推擠畫面) -->
        <div class="quick-reply-drawer" id="reply-drawer">
          <div class="drawer-title" id="drawer-action-title">請選擇花費分類</div>
          <div id="drawer-content-target"></div>
        </div>
        
        <!-- 輸入底欄 -->
        <div class="chat-input-bar">
          <label for="camera-input" class="chat-camera-btn" title="拍攝/上傳收據小票">
            <i class="fa-solid fa-camera"></i>
          </label>
          <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none;" onchange="App.handlePhoto(event)">
          
          <input type="text" id="chat-input-field" class="chat-control" placeholder="輸入開銷、日期或對話..." oninput="App.onLiveTyping()" onkeypress="App.handleKeyPress(event)">
          
          <button class="chat-send-btn" onclick="App.processUserMessage()">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 【分頁二】開銷統計圖表 (手機端獨立滿版，電腦端雙欄並列) -->
  <div class="col" id="panel-chart">
    <div class="card">
      <div class="card-title">
        <span>本月開銷統計圓環</span>
        <span class="num-font" style="font-size: 13px; color: var(--expense); font-weight: 700;" id="total-spent-text">總支出：¥ 0</span>
      </div>
      <div class="pie-chart-wrapper">
        <div id="svg-chart-container" style="width:100%; height:100%; display:flex; justify-content:center; align-items:center;"></div>
      </div>
      <div style="font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 10px;">
        匯率設定：<input type="number" id="rate-setting" value="0.212" step="0.001" style="width:48px; border:none; background:transparent; font-weight:700; color:var(--text-main); outline:none;" onchange="App.updateRate()">
      </div>
    </div>
  </div>

  <!-- 【分頁三】1:1 還原日系手帳消費明細 -->
  <div class="col" id="panel-list">
    <div class="card">
      <div class="card-title">
        <span>歷史消費明細 (依日期分組)</span>
        <button onclick="App.clearAll()" style="background:none; border:none; color:var(--text-muted); font-size:12px; font-weight:700; cursor:pointer;">清空重置</button>
      </div>
      <div class="log-list" id="log-container"></div>
    </div>
  </div>

</div>

<div id="lightbox" onclick="this.style.display='none'">
  <img id="lightbox-img" src="">
</div>

<script>
(function () {
  "use strict";

  var CATEGORIES = [
    { id: "food", name: "餐飲", icon: "🍴", color: "#E29578" },
    { id: "transport", name: "交通", icon: "🚗", color: "#84A59D" },
    { id: "stay", name: "住宿", icon: "🛏️", color: "#9D8189" },
    { id: "shopping", name: "購物", icon: "🛍️", color: "#F5CAC3" },
    { id: "fun", name: "娛樂", icon: "🎬", color: "#F6BD60" },
    { id: "medical", name: "醫療", icon: "🏥", color: "#E8AEB2" },
    { id: "education", name: "教育", icon: "📚", color: "#A7BED3" },
    { id: "daily", name: "日用品", icon: "🏠", color: "#D1B394" },
    { id: "pet", name: "寵物", icon: "🐾", color: "#B3C5B1" },
    { id: "utility", name: "水電費", icon: "⚡", color: "#FFE66D" },
    { id: "phone", name: "通訊費", icon: "📱", color: "#A2D2FF" }
  ];

  var ACCOUNTS = [
    { id: "cash", name: "現金" }, { id: "suica", name: "Suica" }, { id: "credit", name: "信用卡" }, 
    { id: "bank", name: "銀行帳戶" }, { id: "linepay", name: "LINE Pay" }
  ];

  var STORAGE_KEY = "真共榮防跑版系統-完全體-v17";
  var state = { txns: [], exchangeRate: 0.212, pendingTxn: null, currentPhoto: null, activeTab: "chat" };

  function loadInitial() {
    var todayStr = new Date().toISOString().slice(0, 10);
    document.getElementById("txn-date-picker").value = todayStr;

    var val = localStorage.getItem(STORAGE_KEY);
    if (val) {
      try {
        var p = JSON.parse(val);
        if (Array.isArray(p.txns)) state.txns = p.txns;
        if (p.exchangeRate) state.exchangeRate = p.exchangeRate;
      } catch(e){}
    }
    document.getElementById("rate-setting").value = state.exchangeRate;
    
    handleResponsiveLayout();
    renderAll();
  }

  function handleResponsiveLayout() {
    if (window.innerWidth > 768) {
      document.getElementById("panel-chat").style.display = "flex";
      document.getElementById("panel-chart").style.display = "flex";
      document.getElementById("panel-list").style.display = "flex";
    } else {
      App.switchTab(state.activeTab);
    }
  }

  function appendMessage(sender, text, htmlContent) {
    var container = document.getElementById("chat-flow-container");
    var msgRow = document.createElement("div");
    msgRow.className = "msg-row " + sender;
    if (sender === "bot") msgRow.innerHTML = `<div class="bot-avatar">🤖</div><div class="bubble">${text}${htmlContent || ''}</div>`;
    else msgRow.innerHTML = `<div class="bubble">${text}</div>`;
    container.appendChild(msgRow);
    container.scrollTop = container.scrollHeight;
  }

  function renderChart(total) {
    if (total === 0) {
      document.getElementById("svg-chart-container").innerHTML = `<div style="color:var(--text-muted); font-size:13px;">尚無累積數據</div>`;
      return;
    }
    var catTotals = {};
    state.txns.forEach(t => { catTotals[t.category] = (catTotals[t.category] || 0) + t.amount; });
    
    var r = 40, c = 2 * Math.PI * r, currentOffset = 0;
    var svgHtml = `<svg width="100%" height="100%" viewBox="0 0 100 100" style="max-width:145px; max-height:145px;">`;
    CATEGORIES.forEach(cat => {
      var amt = catTotals[cat.id] || 0;
      if (amt > 0) {
        var pct = amt / total;
        var strokeLength = c * pct;
        var strokeOffset = c - strokeLength + currentOffset;
        svgHtml += `<circle cx="50" cy="50" r="${r}" fill="none" stroke="${cat.color}" stroke-width="11" stroke-dasharray="${c}" stroke-dashoffset="${strokeOffset}" transform="rotate(-90 50 50)"></circle>`;
        currentOffset -= strokeLength;
      }
    });
    svgHtml += `</svg>`;
    document.getElementById("svg-chart-container").innerHTML = svgHtml;
  }

  function renderAll() {
    var totalJpy = state.txns.reduce((s, t) => s + t.amount, 0);
    document.getElementById("total-spent-text").textContent = "總支出：¥ " + totalJpy.toLocaleString();
    renderChart(totalJpy);

    var groups = {};
    state.txns.forEach(t => {
      var d = t.date || new Date().toISOString().slice(0,10);
      if(!groups[d]) groups[d] = [];
      groups[d].push(t);
    });

    var sortedDates = Object.keys(groups).sort((a,b) => b.localeCompare(a));

    var logHtml = sortedDates.map(dateStr => {
      var dateObj = new Date(dateStr);
      var options = { month: 'long', day: 'numeric', year: 'numeric' };
      var formattedDate = dateObj.toLocaleDateString('en-US', options);

      var itemsHtml = groups[dateStr].map(t => {
        var c = CATEGORIES.find(x => x.id === t.category) || CATEGORIES[7];
        var a = ACCOUNTS.find(x => x.id === t.account) || ACCOUNTS[0];
        var photoHtml = t.photo ? `<img src="${t.photo}" class="receipt-thumbnail" onclick="App.openLightbox('${t.photo}', event)">` : '';
        var payIcon = a.id === 'suica' ? '🐧' : (a.id === 'credit' ? '💳' : (a.id === 'linepay' ? '💬' : '💴'));
        
        return `
          <div class="log-item">
            <div class="log-left">
              <div class="log-icon-circle">${c.icon}</div>
              <div class="log-title-area">
                <div class="log-title" style="font-size:14.5px; font-weight:700;">${t.note ? t.note : c.name}</div>
                <div class="log-time-stamp"><i class="fa-regular fa-clock" style="font-size:10px;"></i> ${t.time || '00:00'} · ${payIcon} ${a.name}</div>
              </div>
            </div>
            <div class="log-amount-area">
              ${photoHtml}
              <div>
                <div class="log-jpy-val num-font">¥ ${t.amount.toLocaleString()}</div>
                <div class="log-twd-val num-font">≈ NT$ ${Math.round(t.amount * state.exchangeRate).toLocaleString()}</div>
              </div>
              <button class="del-btn-container" onclick="App.deleteRecord(${t.id})"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
        `;
      }).join("");

      return `
        <div class="date-group-container">
          <div class="date-group-header num-font"><i class="fa-regular fa-calendar"></i> ${formattedDate}</div>
          ${itemsHtml}
        </div>
      `;
    }).join("");

    document.getElementById("log-container").innerHTML = logHtml || `<div style="color:var(--text-muted); text-align:center; padding:40px 0; font-size:13px;">本月尚無任何記帳明細</div>`;
  }

  function pad(n) { return n < 10 ? '0' + n : n; }

  function extractAmount(text) {
    var clean = text.replace(/(\d{1,2})[月.\/-](\d{1,2})/g, "").replace(/(?:0)([1-9])([0-3][0-9])/g, "");
    clean = clean.replace(/昨天|前天|台幣|nt|twd|日幣|日圓|元|的/gi, "").trim();
    var match = clean.match(/[\d.]+/);
    return match ? parseFloat(match[0]) : null;
  }

  // 📸 Canvas 智能發票收據小票極限壓縮 API (確保一筆照片控制在 50KB 以內，100%防死機)
  function compressImage(file, callback) {
    var reader = new FileReader();
    reader.onload = e => {
      var img = new Image();
      img.onload = () => {
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        var MAX_WIDTH = 500; // 500px 寬度對小票文字對帳剛剛好
        var scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        callback(canvas.toDataURL('image/jpeg', 0.65)); // 65% 高效壓縮
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.App = {
    switchTab: tabId => {
      if (window.innerWidth > 768) return; 
      state.activeTab = tabId;
      document.getElementById("panel-chat").classList.remove("active-panel");
      document.getElementById("panel-chart").classList.remove("active-panel");
      document.getElementById("panel-list").classList.remove("active-panel");
      document.getElementById("nav-btn-chat").classList.remove("active");
      document.getElementById("nav-btn-chart").classList.remove("active");
      document.getElementById("nav-btn-list").classList.remove("active");
      
      if (tabId === 'chat') {
        document.getElementById("panel-chat").classList.add("active-panel");
        document.getElementById("nav-btn-chat").classList.add("active");
      } else if (tabId === 'chart') {
        document.getElementById("panel-chart").classList.add("active-panel");
        document.getElementById("nav-btn-chart").classList.add("active");
        document.getElementById("badge-chart").style.display = "none";
      } else {
        document.getElementById("panel-list").classList.add("active-panel");
        document.getElementById("nav-btn-list").classList.add("active");
        document.getElementById("badge-list").style.display = "none";
      }
    },
    handleKeyPress: e => { if (e.key === "Enter") App.processUserMessage(); },
    updateRate: () => {
      state.exchangeRate = parseFloat(document.getElementById("rate-setting").value) || 0.212;
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ txns: state.txns, exchangeRate: state.exchangeRate }));
      renderAll();
    },
    onLiveTyping: () => {
      var text = document.getElementById("chat-input-field").value.trim();
      var isTwd = /台幣|nt|twd/i.test(text);
      var num = extractAmount(text);
      
      if (num && num > 0) {
        if (isTwd) {
          document.getElementById("live-twd-board").textContent = "NT$ " + Math.round(num).toLocaleString();
          document.getElementById("live-jpy-board").textContent = "¥ " + Math.round(num / state.exchangeRate).toLocaleString();
        } else {
          document.getElementById("live-jpy-board").textContent = "¥ " + Math.round(num).toLocaleString();
          document.getElementById("live-twd-board").textContent = "NT$ " + Math.round(num * state.exchangeRate).toLocaleString();
        }
      } else {
        document.getElementById("live-jpy-board").textContent = "¥ 0";
        document.getElementById("live-twd-board").textContent = "NT$ 0";
      }
    },
    handlePhoto: e => {
      var file = e.target.files[0];
      if (!file) return;
      compressImage(file, base64 => {
        state.currentPhoto = base64;
        appendMessage("bot", "📸 收據小票已高畫質極速壓縮歸檔！");
      });
    },
    openLightbox: (src, e) => {
      e.stopPropagation();
      document.getElementById("lightbox-img").src = src;
      document.getElementById("lightbox").style.display = "flex";
    },
    processUserMessage: () => {
      var inputEl = document.getElementById("chat-input-field");
      var text = inputEl.value.trim();
      if (!text) return;
      
      appendMessage("user", text);
      inputEl.value = "";

      var targetDate = document.getElementById("txn-date-picker").value;
      var dateInfoText = "";

      if (/昨天/.test(text)) {
        var d = new Date(targetDate); d.setDate(d.getDate() - 1);
        targetDate = d.toISOString().slice(0, 10);
        dateInfoText = " (昨天)";
      } else if (/前天/.test(text)) {
        var d = new Date(targetDate); d.setDate(d.getDate() - 2);
        targetDate = d.toISOString().slice(0, 10);
        dateInfoText = " (前天)";
      } else {
        var dateMatch = text.match(/(\d{1,2})[月.\/-](\d{1,2})/);
        if (!dateMatch) {
          var fourDigitMatch = text.match(/\b(\d{2})(\d{2})\b/);
          if (fourDigitMatch) {
            var m = parseInt(fourDigitMatch[1]);
            var day = parseInt(fourDigitMatch[2]);
            if (m >= 1 && m <= 12 && day >= 1 && day <= 31) {
              targetDate = `2026-${pad(m)}-${pad(day)}`;
              dateInfoText = ` (自動跳轉至 ${m}/${day})`;
            }
          }
        } else if (dateMatch) {
          var m = pad(parseInt(dateMatch[1]));
          var day = pad(parseInt(dateMatch[2]));
          targetDate = `2026-${m}-${day}`;
          dateInfoText = ` (自動跳轉至 ${m}/${day})`;
        }
      }

      document.getElementById("txn-date-picker").value = targetDate;

      var isTwd = /台幣|nt|twd/i.test(text);
      var rawAmount = extractAmount(text);

      if (!rawAmount || rawAmount <= 0) {
        appendMessage("bot", "❌ 沒辨識到開銷數字喔！格式請輸入如：`餐飲 1200` 或 `07/01 665`。");
        return;
      }

      // 智慧提取品項備註
      var note = text.replace(/昨天|前天|台幣|nt|twd|日幣|日圓|元|的/gi, "")
                     .replace(/(\d{1,2})[月.\/-](\d{1,2})/g, "")
                     .replace(/\b\d{4}\b/g, "") 
                     .replace(new RegExp(rawAmount, 'g'), "")
                     .replace(/\s+/g, " ").trim();

      var category = null;
      var foundCat = CATEGORIES.find(c => text.includes(c.name));
      if (foundCat) {
        category = foundCat.id;
        note = note.replace(foundCat.name, "").trim();
      }

      var finalJpy = isTwd ? Math.round(rawAmount / state.exchangeRate) : Math.round(rawAmount);
      var finalTwd = isTwd ? Math.round(rawAmount) : Math.round(rawAmount * state.exchangeRate);

      // 自動記錄當前精確時間戳記 (時:分)
      var now = new Date();
      var timeStr = pad(now.getHours()) + ":" + pad(now.getMinutes());

      state.pendingTxn = { amount: finalJpy, note: note || "", category: category, account: "cash", photo: state.currentPhoto, date: targetDate, time: timeStr };
      state.currentPhoto = null;

      var currencyReport = isTwd ? `台幣 NT$ ${finalTwd.toLocaleString()} (折合日圓 ¥ ${finalJpy.toLocaleString()})` : `日圓 ¥ ${finalJpy.toLocaleString()} (折合台幣 NT$ ${finalTwd.toLocaleString()})`;

      // 🎁 啟動防跑版底部快顯抽屜機制
      var drawer = document.getElementById("reply-drawer");
      var drawerTitle = document.getElementById("drawer-action-title");
      var target = document.getElementById("drawer-content-target");
      
      if (!category) {
        drawerTitle.textContent = "請點選花費分類 💰金額：" + (isTwd ? "NT$"+rawAmount : "¥"+rawAmount);
        target.innerHTML = `<div class="chat-guide-box">` + CATEGORIES.map(c => `<button class="guide-btn" onclick="App.selectPendingCat('${c.id}')"><span>${c.icon}</span><span>${c.name}</span></button>`).join("") + `</div>`;
        drawer.style.display = "flex";
        appendMessage("bot", `📅 交易日期：${targetDate}${dateInfoText}<br>金額分析：${currencyReport}。請在下方抽屜點選消費分類。`);
      } else {
        appendMessage("bot", `📅 交易日期：${targetDate}${dateInfoText}<br>金額分析：${currencyReport}<br>備註：${note || foundCat.name}`);
        App.askAccount();
      }
    },
    selectPendingCat: catId => {
      if (!state.pendingTxn) return;
      state.pendingTxn.category = catId;
      var c = CATEGORIES.find(x => x.id === catId);
      if(!state.pendingTxn.note) state.pendingTxn.note = c.name; // 空值自動遞補為分類名稱
      App.askAccount();
    },
    askAccount: () => {
      var drawer = document.getElementById("reply-drawer");
      var drawerTitle = document.getElementById("drawer-action-title");
      var target = document.getElementById("drawer-content-target");
      
      drawerTitle.textContent = "請點選支付工具帳戶";
      target.innerHTML = `<div class="chip-guide-box">` + ACCOUNTS.map(a => `<button class="chip-guide-btn" onclick="App.finalSave('${a.id}')">${a.name}</button>`).join("") + `</div>`;
      drawer.style.display = "flex";
    },
    finalSave: accountId => {
      if (!state.pendingTxn) return;
      state.pendingTxn.account = accountId;
      
      var t = state.pendingTxn;
      state.txns.unshift(t);
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ txns: state.txns, exchangeRate: state.exchangeRate }));
      state.pendingTxn = null;

      // 關閉快顯抽屜
      document.getElementById("reply-drawer").style.display = "none";
      appendMessage("bot", `✅ 成功寫入手帳！`);
      
      // 手機端更新提示紅點亮起
      if (window.innerWidth <= 768) {
        document.getElementById("badge-chart").style.display = "block";
        document.getElementById("badge-list").style.display = "block";
      }

      document.getElementById("txn-date-picker").value = new Date().toISOString().slice(0, 10);
      document.getElementById("live-jpy-board").textContent = "¥ 0";
      document.getElementById("live-twd-board").textContent = "NT$ 0";
      renderAll();
    },
    deleteRecord: id => {
      if (confirm("確定要刪除這筆紀錄嗎？")) {
        state.txns = state.txns.filter(t => t.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ txns: state.txns, exchangeRate: state.exchangeRate }));
        renderAll();
      }
    },
    clearAll: () => {
      if (confirm("確定要格式化清除所有紀錄與收據小票嗎？")) {
        state.txns = [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ txns: [], exchangeRate: state.exchangeRate }));
        renderAll();
      }
    }
  };

  window.addEventListener('resize', handleResponsiveLayout);
  loadInitial();
})();
</script>
</body>
</html>
